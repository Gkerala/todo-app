<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Todo</title>
  <style>
    :root {
      color-scheme: light dark; /* 달력 아이콘, 체크박스 같은 기본 부품도 다크 모드에 맞춤 */
      --bg: #f4f5fb; --card: #ffffff; --text: #1f2430; --muted: #6b7280; --line: #e6e8f0;
      --accent: #4f46e5; --accent-soft: #eef0ff; --accent-text: #ffffff;
      --danger: #dc2626; --danger-soft: #fdecec; --ok: #15803d; --ok-soft: #e7f6ec; --warn-soft: #fff4e0; --warn: #b45309;
      --shadow: 0 1px 2px rgba(20, 24, 40, .05), 0 8px 24px rgba(20, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111320; --card: #1a1d2e; --text: #eceef7; --muted: #9aa1b5; --line: #2b2f45;
        --accent: #8b87ff; --accent-soft: #26294a; --accent-text: #12142a;
        --danger: #ff7b7b; --danger-soft: #3a2026; --ok: #6ee7a0; --ok-soft: #1c3329; --warn-soft: #3a2f1a; --warn: #fbbf6a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      }
    }
    [hidden] { display: none !important; } /* display 지정이 hidden 속성을 덮어쓰지 않게 */
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 720px; margin: 0 auto; padding: 32px 16px 56px; }

    /* 상단 */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .top h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
    .top-right { display: flex; align-items: center; gap: 10px; }
    .badge { font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }

    /* 안내 메시지 */
    #msg { min-height: 0; margin-bottom: 14px; }
    #msg:not(:empty) { padding: 11px 14px; border-radius: 12px; font-size: .92rem; background: var(--danger-soft); color: var(--danger); }
    #msg.ok:not(:empty) { background: var(--ok-soft); color: var(--ok); }

    /* 카드 */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; }
    .card + .card { margin-top: 14px; }

    /* 입력과 버튼 */
    input[type=text], input[type=email], input[type=password], input[type=date] {
      width: 100%; font: inherit; color: var(--text); background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0;
    }
    input::placeholder { color: var(--muted); }
    input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 10px 16px;
      border: 1px solid var(--line); background: var(--card); color: var(--text); white-space: nowrap;
    }
    .btn:hover { background: var(--accent-soft); }
    .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.small { padding: 6px 12px; font-size: .85rem; }

    /* 로그인 / 회원가입 */
    .auth { max-width: 420px; margin: 40px auto 0; }
    .auth h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .auth .sub { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }
    .auth label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 14px; }
    .auth label input { margin-top: 6px; font-weight: 400; }
    .auth .actions { display: grid; gap: 10px; margin-top: 6px; }
    .auth .divider { text-align: center; color: var(--muted); font-size: .85rem; margin: 14px 0 10px; }
    .note { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: .86rem; }

    /* 할 일 추가 */
    .add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
    .add .title { grid-column: 1 / -1; }
    .field-label { font-size: .78rem; color: var(--muted); margin: 0 0 4px 2px; display: block; }

    /* 필터 */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .toolbar .search { flex: 1 1 200px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: .9rem; font-weight: 600;
      padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
    .pill:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .pill input { accent-color: var(--accent); margin: 0; }
    .tagfilter { font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 8px 14px;
      border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); }

    /* 목록 */
    #list { list-style: none; margin: 14px 0 0; padding: 0; }
    .item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; margin: 0; }
    .item .name { font-weight: 600; word-break: break-word; }
    .item.done .name { color: var(--muted); text-decoration: line-through; font-weight: 500; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .due, .tag { font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
    .due { background: var(--line); color: var(--muted); }
    .due.today { background: var(--ok-soft); color: var(--ok); }
    .due.late { background: var(--warn-soft); color: var(--warn); }
    .tag { background: var(--accent-soft); color: var(--accent); cursor: pointer; border: 0; font-family: inherit; }
    .tag:hover { filter: brightness(.95); }
    .del { font: inherit; font-size: .82rem; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .del:hover { color: var(--danger); background: var(--danger-soft); }
    .empty { text-align: center; padding: 34px 8px 20px; color: var(--muted); }
    .empty b { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }

    @media (max-width: 520px) {
      .shell { padding-top: 20px; }
      .card { padding: 16px; border-radius: 16px; }
      .add { grid-template-columns: 1fr; }
      .add .title { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <h1>My Todo</h1>
      <div class="top-right">
        <span id="mode" class="badge"></span>
        <button id="logout" class="btn small" hidden>로그아웃</button>
      </div>
    </header>

    <div id="msg" role="status" aria-live="polite"></div>

    <!-- 로그인: Supabase(클라우드) 모드에서만 보인다 -->
    <section id="loginView" class="card auth" hidden>
      <h2>로그인</h2>
      <p class="sub">내 할 일은 내 계정으로만 볼 수 있어요.</p>
      <form id="login">
        <label>이메일
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="username">
        </label>
        <label>비밀번호
          <input type="password" id="password" placeholder="비밀번호" required autocomplete="current-password">
        </label>
        <div class="actions">
          <button class="btn primary">로그인</button>
        </div>
      </form>
      <div class="divider">처음이신가요?</div>
      <button type="button" id="toSignup" class="btn" style="width:100%">회원가입</button>
    </section>

    <!-- 회원가입: 별도 화면. 가입이 끝나면 로그인 화면으로 돌아간다 -->
    <section id="signupView" class="card auth" hidden>
      <h2>회원가입</h2>
      <p class="sub">이메일과 비밀번호만 있으면 돼요.</p>
      <form id="signup">
        <label>이메일
          <input type="email" id="suEmail" placeholder="you@example.com" required autocomplete="username">
        </label>
        <label>비밀번호 (8자 이상)
          <input type="password" id="suPassword" placeholder="8자 이상" required minlength="8" autocomplete="new-password">
        </label>
        <label>비밀번호 확인
          <input type="password" id="suPassword2" placeholder="한 번 더 입력" required minlength="8" autocomplete="new-password">
        </label>
        <div class="actions">
          <button class="btn primary">가입하기</button>
          <button type="button" id="toLogin" class="btn">로그인으로 돌아가기</button>
        </div>
      </form>
      <p class="note">이메일 인증이 없어서 형식만 맞으면 돼요. 실제 이메일이 아니어도 됩니다. 계정을 두 개 만들면 서로의 할 일이 보이지 않는 것도 확인할 수 있어요.</p>
    </section>

    <!-- 할 일: 추가, 필터, 목록이 한 화면에 -->
    <main id="app" class="card" hidden>
      <form id="add" class="add">
        <div class="title">
          <label class="field-label" for="title">할 일</label>
          <input type="text" id="title" placeholder="무엇을 해야 하나요?" required>
        </div>
        <div>
          <label class="field-label" for="due">마감일</label>
          <input type="date" id="due">
        </div>
        <div>
          <label class="field-label" for="tags">태그 (쉼표로 구분)</label>
          <input type="text" id="tags" placeholder="예: 공부, 급함">
        </div>
        <div style="align-self:end">
          <button class="btn primary" style="width:100%">추가</button>
        </div>
      </form>

      <div class="toolbar">
        <input type="text" id="q" class="search" placeholder="제목 검색" aria-label="제목 검색">
        <label class="pill"><input type="checkbox" id="today"> 오늘 할 일만</label>
        <button id="clearTag" class="tagfilter" hidden></button>
      </div>

      <ul id="list"></ul>
    </main>
  </div>

  <script>
    // 화면은 백엔드 API에만 요청한다. DB(SQLite/Supabase)는 직접 부르지 않는다.
    const $ = id => document.getElementById(id);
    let tagFilter = '';
    let needLogin = false;
    let view = 'login'; // 'login' | 'signup' (로그인 필요 모드에서 로그인 전에만 쓰임)

    // 로그인 토큰은 이 탭이 열려 있는 동안만 보관한다 (탭을 닫으면 사라짐)
    const getToken = () => { try { return sessionStorage.getItem('token'); } catch { return null; } };
    const setToken = t => { try { t ? sessionStorage.setItem('token', t) : sessionStorage.removeItem('token'); } catch {} };

    const today = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD (내 시간대)

    function setMsg(text = '', kind = '') {
      $('msg').textContent = text;
      $('msg').className = kind;
    }

    async function api(method, path, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (getToken()) headers.Authorization = 'Bearer ' + getToken();
      const res = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
      if (res.status === 401 && needLogin) {
        setToken(null); go('login', '로그인이 만료되었어요. 다시 로그인해 주세요.');
        throw new Error('로그인이 필요합니다');
      }
      return res;
    }

    // 화면 전환. msg를 주면 전환 뒤에 보여 준다.
    function go(next, msg = '', kind = '') {
      view = next;
      try { history.replaceState(null, '', next === 'signup' ? '#signup' : location.pathname); } catch {}
      setMsg(msg, kind);
      render();
    }

    function render() {
      const loggedIn = !needLogin || !!getToken();
      $('loginView').hidden = loggedIn || view !== 'login';
      $('signupView').hidden = loggedIn || view !== 'signup';
      $('app').hidden = !loggedIn;
      $('logout').hidden = !(needLogin && loggedIn);
      if (loggedIn) load();
    }

    function dueBadge(t) {
      if (!t.due_date) return null;
      const el = document.createElement('span');
      el.className = 'due';
      if (t.due_date === today()) { el.classList.add('today'); el.textContent = '오늘 · ' + t.due_date; }
      else if (t.due_date < today() && !t.done) { el.classList.add('late'); el.textContent = '기한 지남 · ' + t.due_date; }
      else el.textContent = t.due_date;
      return el;
    }

    async function load() {
      const p = new URLSearchParams();
      if ($('q').value) p.set('q', $('q').value);
      if ($('today').checked) p.set('today', '1');
      if (tagFilter) p.set('tag', tagFilter);
      const res = await api('GET', '/api/todos?' + p);
      if (!res.ok) { setMsg((await res.json()).error); return; }
      const todos = await res.json();

      $('clearTag').hidden = !tagFilter;
      $('clearTag').textContent = `#${tagFilter} 필터 해제 ✕`;

      const list = $('list');
      list.replaceChildren();
      for (const t of todos) {
        const li = document.createElement('li');
        li.className = 'item' + (t.done ? ' done' : '');

        const box = document.createElement('input');
        box.type = 'checkbox'; box.checked = t.done; box.setAttribute('aria-label', '완료 표시');
        box.onchange = async () => { await api('PATCH', '/api/todos/' + t.id, { done: box.checked }); load(); };

        const body = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'name'; name.textContent = t.title; // textContent: XSS 방지
        body.append(name);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const due = dueBadge(t);
        if (due) meta.append(due);
        for (const tagName of t.tags) {
          const tag = document.createElement('button');
          tag.type = 'button'; tag.className = 'tag'; tag.textContent = '#' + tagName;
          tag.title = '이 태그로 거르기';
          tag.onclick = () => { tagFilter = tagName; load(); };
          meta.append(tag);
        }
        if (meta.children.length) body.append(meta);

        const del = document.createElement('button');
        del.type = 'button'; del.className = 'del'; del.textContent = '삭제';
        del.setAttribute('aria-label', t.title + ' 삭제');
        del.onclick = async () => { await api('DELETE', '/api/todos/' + t.id); load(); };

        li.append(box, body, del);
        list.append(li);
      }

      if (!todos.length) {
        const filtering = $('q').value || $('today').checked || tagFilter;
        const li = document.createElement('li');
        li.className = 'empty';
        const b = document.createElement('b');
        b.textContent = filtering ? '조건에 맞는 할 일이 없어요' : '할 일이 없어요';
        li.append(b, filtering ? '필터를 바꾸거나 해제해 보세요.' : '위에서 첫 할 일을 추가해 보세요.');
        list.append(li);
      }
    }

    $('add').onsubmit = async e => {
      e.preventDefault();
      const res = await api('POST', '/api/todos', {
        title: $('title').value,
        due_date: $('due').value || null,
        tags: $('tags').value.split(','),
      });
      if (!res.ok) { setMsg((await res.json()).error); return; }
      setMsg();
      e.target.reset();
      load();
    };

    $('login').onsubmit = async e => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value, password: $('password').value }),
      });
      $('password').value = '';
      if (!res.ok) return setMsg((await res.json()).error);
      setToken((await res.json()).token);
      setMsg();
      render();
    };

    $('signup').onsubmit = async e => {
      e.preventDefault();
      const email = $('suEmail').value.trim();
      if ($('suPassword').value !== $('suPassword2').value) return setMsg('비밀번호가 서로 달라요. 다시 확인해 주세요.');
      const res = await fetch('/api/signup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: $('suPassword').value }),
      });
      const body = await res.json();
      if (!res.ok) return setMsg(body.error);
      // 가입이 끝나면 자동 로그인하지 않고, 로그인 화면으로 돌아간다 (받은 토큰은 쓰지 않는다)
      e.target.reset();
      $('email').value = email;
      $('password').value = '';
      go('login', body.message || '가입이 완료되었어요. 로그인해 주세요.', 'ok');
      $('password').focus();
    };

    $('toSignup').onclick = () => go('signup');
    $('toLogin').onclick = () => go('login');
    $('logout').onclick = () => { setToken(null); tagFilter = ''; go('login'); };
    $('q').oninput = load;
    $('today').onchange = load;
    $('clearTag').onclick = () => { tagFilter = ''; load(); };

    (async () => {
      const cfg = await (await fetch('/api/config')).json();
      needLogin = cfg.login;
      $('mode').textContent = cfg.mode === 'supabase' ? '☁ Supabase' : '💻 로컬 SQLite';
      view = location.hash === '#signup' ? 'signup' : 'login';
      render();
    })();
  </script>
</body>
</html>
